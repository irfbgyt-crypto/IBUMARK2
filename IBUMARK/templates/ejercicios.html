{% extends 'base.html' %}

{% block contenido %}

<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">

        <li class="breadcrumb-item">
            <a href="/">Inicio</a>
        </li>

        <li class="breadcrumb-item active">
            Biblioteca
        </li>

    </ol>
</nav>

<div class="text-center mb-5">

    <i class="bi bi-book-half display-1 text-primary"></i>

    <h1 class="display-4">
        Biblioteca de Ejercicios
    </h1>

    <p class="lead">
        Aprende la ejecución correcta de cada ejercicio.
    </p>

</div>

<div class="row">

{% for e in ejercicios %}

<div class="col-lg-4 col-md-6 mb-4">

    <div class="card h-100 shadow-lg">

        <img
            src="{{ url_for('static', filename='img/ejercicios/' ~ e.imagen) }}"
            class="card-img-top"
            alt="{{ e.nombre }}"
            style="height:300px; object-fit:cover;"
        >

        <div class="card-body d-flex flex-column">

            <span class="badge bg-primary mb-3">
                {{ e.grupo }}
            </span>

            <h3>
                {{ e.nombre }}
            </h3>

            <p class="text-muted">
                {{ e.descripcion }}
            </p>

            <div class="mt-auto">

                <a href="/ejercicio/{{ loop.index0 }}"
                   class="btn btn-primary w-100">

                    <i class="bi bi-eye-fill"></i>

                    Ver ejercicio

                </a>

            </div>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
