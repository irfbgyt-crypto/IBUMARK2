{% extends 'base.html' %}

{% block contenido %}

<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">

        <li class="breadcrumb-item">
            <a href="/">Inicio</a>
        </li>

        <li class="breadcrumb-item active">
            Mi Progreso
        </li>

    </ol>
</nav>

<div class="text-center mb-5">

    <i class="bi bi-graph-up-arrow display-1 text-primary"></i>

    <h1 class="display-4">
        Mi Progreso
    </h1>

    <p class="lead">
        Visualiza tu evolución física a lo largo del tiempo.
    </p>

</div>

<div class="row">

    <div class="col-lg-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h4>Peso (kg)</h4>

                <canvas id="pesoChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-lg-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h4>Pecho (cm)</h4>

                <canvas id="pechoChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-lg-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h4>Cintura (cm)</h4>

                <canvas id="cinturaChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-lg-6 mb-4">

        <div class="card">

            <div class="card-body">

                <h4>Brazo (cm)</h4>

                <canvas id="brazoChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-lg-12">

        <div class="card">

            <div class="card-body">

                <h4>Pierna (cm)</h4>

                <canvas id="piernaChart"></canvas>

            </div>

        </div>

    </div>

</div>

<!-- ChartJS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const fechas = {{ fechas|tojson }};

function crearGrafica(id, titulo, datos, color){

    const ctx = document.getElementById(id);

    new Chart(ctx, {

        type: "line",

        data: {

            labels: fechas,

            datasets: [{

                label: titulo,

                data: datos,

                borderColor: color,

                backgroundColor: color + "33",

                fill: true,

                tension: 0.45,

                borderWidth: 4,

                pointRadius: 6,

                pointHoverRadius: 10,

                pointBackgroundColor: "#FFFFFF",

                pointBorderColor: color,

                pointBorderWidth: 3

            }]

        },

        options: {

            responsive: true,

            animation: {

                duration: 1800

            },

            plugins: {

                legend: {

                    display: false

                }

            },

            scales: {

                x: {

                    grid: {

                        display: false

                    }

                },

                y: {

                    grid: {

                        color: "#DCEEFF"

                    }

                }

            }

        }

    });

}

crearGrafica("pesoChart","Peso",{{ pesos|tojson }},"#0D47A1");

crearGrafica("pechoChart","Pecho",{{ pechos|tojson }},"#1565C0");

crearGrafica("cinturaChart","Cintura",{{ cinturas|tojson }},"#1976D2");

crearGrafica("brazoChart","Brazo",{{ brazos|tojson }},"#1E88E5");

crearGrafica("piernaChart","Pierna",{{ piernas|tojson }},"#2196F3");

</script>

{% endblock %}
